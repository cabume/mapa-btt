<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Mapa BTT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1f2a1f">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  :root { --bg:#171c17; --panel:#1f261f; --line:#2f3a2f; --txt:#e8ece6; --muted:#9aa596; --acc:#f08c00; --strava:#fc4c02; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display:flex; }
  #side { width:390px; min-width:390px; height:100%; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line); }
  #map { flex:1; height:100%; background:#ddd; }
  header { padding:12px 14px 0; }
  header h1 { margin:0; font-size:19px; display:flex; align-items:center; gap:8px; }
  header h1 span { flex:1; }
  .stats { color:var(--muted); font-size:13px; margin:4px 0 10px; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); padding:9px; font-size:14px; cursor:pointer; }
  .tabs button.on { color:var(--txt); border-color:var(--acc); font-weight:600; }
  #body { flex:1; overflow-y:auto; padding:10px 14px 20px; }
  #status { padding:6px 14px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); min-height:28px; }
  button, .btn { background:#2d382d; color:var(--txt); border:1px solid #3d4a3d; border-radius:7px; padding:6px 10px; font-size:13px; cursor:pointer; text-decoration:none; display:inline-block; }
  button:hover, .btn:hover { background:#384638; }
  button.pri { background:var(--acc); border-color:var(--acc); color:#111; font-weight:600; }
  button.strava { background:var(--strava); border-color:var(--strava); color:#fff; font-weight:600; }
  button.ico { background:none; border:0; font-size:18px; padding:2px 6px; }
  input, select, textarea { background:#141914; color:var(--txt); border:1px solid #3d4a3d; border-radius:7px; padding:6px 8px; font:inherit; }
  textarea { width:100%; resize:vertical; min-height:54px; }
  .muted { color:var(--muted); }
  .filters { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
  .filters input[type=search] { grid-column:1/3; }
  .filters label { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--muted); }
  .row { display:flex; align-items:center; gap:8px; padding:7px 6px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:6px; }
  .row:hover { background:#273027; }
  .row.cur { background:#2d382d; }
  .row .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .row .t { flex:1; min-width:0; }
  .row .t b { display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .t small { color:var(--muted); }
  .star { font-size:20px; background:none; border:0; padding:0 4px; color:#5b665a; }
  .star.on { color:#ffc107; }
  .year { margin:14px 0 4px; font-weight:700; color:var(--acc); font-size:13px; letter-spacing:.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip { background:#141914; border:1px solid var(--line); border-radius:20px; padding:3px 10px; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; margin:8px 0; }
  .grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; cursor:zoom-in; display:block; background:#111; }
  .grid div { position:relative; }
  .grid div i { position:absolute; right:4px; bottom:3px; font-style:normal; font-size:12px; text-shadow:0 0 3px #000; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  h2 { font-size:17px; margin:6px 0 2px; }
  .card { background:#1a211a; border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0; }
  .card ol { padding-left:18px; margin:6px 0; }
  .card li { margin:4px 0; }
  .card label { display:block; margin:8px 0 3px; font-size:13px; color:var(--muted); }
  .card input[type=text], .card input[type=password] { width:100%; }
  #perfil { width:100%; height:90px; display:block; background:#141914; border-radius:8px; cursor:crosshair; }
  .regions { position:absolute; top:10px; left:50px; z-index:500; display:flex; gap:5px; }
  .regions button { background:rgba(23,28,23,.88); font-size:12px; }
  .legend { background:rgba(23,28,23,.88); color:var(--txt); padding:6px 9px; border-radius:8px; font-size:12px; line-height:1.6; }
  .legend i { display:inline-block; width:18px; height:4px; border-radius:2px; vertical-align:middle; margin-right:6px; }
  /* marcadores de fotos */
  .phm { width:52px; height:52px; border-radius:10px; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.5); overflow:hidden; position:relative; background:#333; }
  .phm.approx { border-style:dashed; }
  .phm img { width:100%; height:100%; object-fit:cover; display:block; }
  .phm b { position:absolute; right:0; bottom:0; background:var(--acc); color:#111; font-size:11px; padding:0 4px; border-top-left-radius:6px; }
  .pulse { animation: pulse 1s ease-out 3; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(240,140,0,.9); } 100% { box-shadow:0 0 0 22px rgba(240,140,0,0); } }
  /* visor de fotos */
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:2000; display:none; flex-direction:column; }
  #lb.on { display:flex; }
  #lb .img { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; }
  #lb .img img { max-width:100%; max-height:100%; object-fit:contain; }
  #lb .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:34px; background:rgba(0,0,0,.4); border:0; width:56px; height:80px; }
  #lb .prev { left:10px; } #lb .next { right:10px; }
  #lb .bar { padding:10px 16px; display:flex; align-items:center; gap:10px; }
  #lb .bar .t { flex:1; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 16px; border-radius:8px; z-index:3000; display:none; max-width:80%; }
  .leaflet-tooltip { font-size:13px; }
  #perfil { touch-action: pan-y; }
  #handle { display:none; }
  /* móvil: mapa a pantalla completa y la lista en un panel que sube desde abajo */
  @media (max-width: 800px) {
    body { display:block; }
    #map { position:fixed; inset:0; }
    #side { position:fixed; left:0; right:0; bottom:0; width:auto; min-width:0; height:46vh; z-index:1000; border-right:0;
            border-radius:14px 14px 0 0; box-shadow:0 -4px 16px rgba(0,0,0,.45); transition:height .25s; }
    #side[data-h=min] { height:122px; }
    #side[data-h=max] { height:88vh; }
    #handle { display:block; height:22px; cursor:pointer; flex:none; }
    #handle::before { content:''; display:block; width:46px; height:5px; border-radius:3px; background:#56645a; margin:8px auto 0; }
    header { padding:0 14px; }
    header h1 { font-size:17px; }
    .stats { margin:2px 0 6px; }
    .tabs button { padding:7px; }
    .row { padding:10px 6px; }
    input, select, textarea { font-size:16px; }
    .regions { left:54px; right:58px; flex-wrap:wrap; }
    .regions button { padding:5px 7px; }
    .leaflet-bottom.leaflet-left { display:none; }
    #lb .bar { flex-wrap:wrap; }
    #lb .bar .t { flex-basis:100%; }
    #lb .nav { width:40px; height:60px; font-size:26px; }
  }
</style>
</head>
<body>
<aside id="side">
  <div id="handle" onclick="cycleSheet()" title="Subir / bajar la lista"></div>
  <header>
    <h1>🚵 <span>Mi Mapa BTT</span><button class="ico" title="Ajustes y Strava" onclick="openSettings()">⚙️</button></h1>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs">
    <button id="tabMapa" onclick="setTab('mapa')">🗺️ Mi mapa</button>
    <button id="tabElegir" onclick="setTab('elegir')">☆ Elegir rutas</button>
  </nav>
  <div id="body"></div>
  <div id="status"></div>
</aside>
<div id="map"></div>

<div id="lb">
  <div class="img">
    <button class="nav prev" onclick="lbGo(-1)">‹</button>
    <div id="lbMedia" style="display:contents"></div>
    <button class="nav next" onclick="lbGo(1)">›</button>
  </div>
  <div class="bar">
    <div class="t" id="lbTxt"></div>
    <button onclick="lbMap()">📍 Ver en el mapa</button>
    <a class="btn" id="lbOpen" target="_blank">↗ Original</a>
    <button onclick="lbClose()">✕ Cerrar</button>
  </div>
</div>
<div id="toast"></div>

<script src="lib/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
